<main>

  <section id="stones">

    </div>
  </section>

<script src="catalogue-data.js"></script>
<script src="site-common.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const catKey = params.get('cat') || 'natural';
  const shapeSlug = params.get('shape') || 'round';

  const cat = CATALOGUE_META.categories[catKey] || CATALOGUE_META.categories.natural;
  const shapeName = CATALOGUE_META.shapes.find(s => CATALOGUE_META.shapeSlug[s] === shapeSlug) || 'Round';

  const shapeIntros = {
    round: "The round brilliant is the undisputed icon of the gem world, engineered by Marcel Tolkowsky for maximum brilliance, fire and scintillation. Its symmetry hides inclusions and masks body colour better than any other cut, and its rounded profile resists chipping in daily wear.",
    princess: "The princess cut brings crisp, architectural lines to a square silhouette. Its pointed corners deliver strong brilliance while preserving more of the rough stone's original weight than round cuts.",
    emerald: "The emerald cut favours open step facets over maximum sparkle, creating a quiet hall-of-mirrors effect that rewards exceptional clarity and clean proportion.",
    oval: "The oval cut elongates the finger with a continuous, elegant glow, offering brilliance close to round while standing apart with its distinctive silhouette.",
    pear: "The pear shape combines round-cut brilliance with a graceful single point, a versatile shape equally suited to rings, pendants and earrings.",
    radiant: "The radiant cut pairs faceted brilliance with bold trimmed corners, bridging the durability of a princess cut with sparkle closer to round.",
    heart: "The heart cut is the most romantic and symbolic silhouette in diamond cutting, requiring exceptional skill from the cutter to achieve true symmetry."
  };

  document.getElementById('pageTitle').textContent = `${shapeName} Diamonds — ${cat.label} — Heera Cartel Co.`;
  document.getElementById('pageDesc').setAttribute('content', `${shapeName} ${cat.label.toLowerCase()} from Heera Cartel Co. — wholesale, certified stones sourced direct from manufacturing units in Surat.`);

  document.getElementById('breadcrumb').innerHTML = `
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="index.html#catalogue">${cat.label}</a><span class="sep">/</span>
    <span class="current">${shapeName} Diamonds</span>
  `;
  document.getElementById('backLink').href = 'index.html#catalogue';
  document.getElementById('shapeLabel').textContent = `${shapeName} · ${cat.label}`;
  document.getElementById('shapeTitle').textContent = `${shapeName} Diamonds`;
  document.getElementById('shapeDesc').textContent = shapeIntros[shapeSlug] || '';

  const products = CATALOGUE.filter(p => p.category === catKey && p.shapeSlug === shapeSlug);
  document.getElementById('stoneCount').textContent = `${products.length} representative ${shapeName.toLowerCase()} stones`;

  function specRowsHtml(p){
    return Object.entries(p.specs).slice(0, 3).map(([k, v]) => `
      <div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>
    `).join('');
  }

  const grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p => `
    <div class="stone-card">
      <a href="product.html?id=${p.id}">
        <div class="stone-frame" data-active="0">
          ${renderMediaItems(p.media, `${p.shape} diamond, ${p.carat}`)}
          ${renderMediaNav(p.media)}
          <span class="stone-ref">${p.ref}</span>
        </div>
      </a>
      <div class="stone-body">
        <a href="product.html?id=${p.id}"><p class="stone-title">${p.title}</p></a>
        <div class="stone-specs">${specRowsHtml(p)}</div>
        <p class="stone-cert">${p.cert} Certified</p>
        <a class="stone-cta" href="product.html?id=${p.id}">View full details →</a>
        <a class="stone-cta secondary" href="${waLink(WHATSAPP_NUMBER, 'Hi Heera Cartel Co., I would like more details on stone reference ' + p.ref + ' (' + p.shape + ', ' + p.carat + ').')}" target="_blank" rel="noopener">Enquire on WhatsApp</a>
      </div>
    </div>
  `).join('');

  // Wire up media prev/next buttons rendered above (they call the shared stepMedia from site-common.js).
</script>

</body>

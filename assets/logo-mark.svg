<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Heera Cartel Co. — diamond monogram, recreated as a clean vector (transparent background).
    Stroke colour is set for use on the dark theme (cream on dark). For use on a light
    background, change stroke="#f2eee6" to stroke="#3a362f" below.

    NOTE ON FONT: the monogram text below uses "Simple Serenity Serif" with "Cormorant Garamond"
    as a free fallback, since Simple Serenity is a paid font (Set Sail Studios) licensed for use
    inside Canva only. Buy a web-font license and self-host the file to render this in the exact
    original typeface — see the @font-face note at the top of index.html.
  -->
  <g fill="none" stroke="#f2eee6" stroke-width="2.5" stroke-linejoin="round">
    <!-- table (top facet) -->
    <ellipse cx="200" cy="95" rx="140" ry="42"/>
    <!-- crown facets -->
    <path d="M60 95 L120 40 L200 53 L280 40 L340 95"/>
    <path d="M120 40 L150 95 M200 53 L200 95 M280 40 L250 95"/>
    <!-- girdle to pavilion -->
    <path d="M60 95 L200 320 L340 95"/>
    <path d="M120 95 L200 320 M200 95 L200 320 M280 95 L200 320"/>
  </g>
  <text x="200" y="215" text-anchor="middle"
        font-family="'Simple Serenity Serif','Cormorant Garamond',serif"
        font-size="120" fill="#f2eee6" letter-spacing="2">HCC</text>
</svg>
